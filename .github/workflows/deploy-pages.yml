name: Deploy to GitHub Pages

# 推送到 main 分支即自动构建并发布预览站
on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要 pages:write 与 id-token:write 才能通过 OIDC 发布
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pages
        env:
          # Dify 聊天气泡凭据（仓库 Settings → Secrets 中配置）
          VITE_DIFY_CHATBOT_TOKEN: ${{ secrets.VITE_DIFY_CHATBOT_TOKEN }}
          VITE_DIFY_BASE_URL: https://udify.app
          # 站点正式地址，用于 canonical / og:url / sitemap.xml
          # 在仓库 Settings → Secrets and variables → Actions → Variables 中维护；
          # 为空时构建脚本会跳过这些标签，避免在域名生效前指向死地址
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      # 说明：build:pages 内部会为 /about、/projects/<id> 等路由生成带独立
      # <title>/description/canonical 的 <route>/index.html，并生成 404.html、
      # robots.txt、sitemap.xml，详见 scripts/generate-static-routes.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
